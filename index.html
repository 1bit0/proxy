<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>In-Page Web Proxy Viewer</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    #navbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    #urlInput {
      flex: 1;
      padding: 0.5rem 0.8rem;
      font-size: 0.95rem;
      background: #0f172a;
      border: 1px solid #475569;
      color: #f8fafc;
      border-radius: 4px;
      outline: none;
    }
    #urlInput:focus { border-color: #38bdf8; }
    button {
      padding: 0.5rem 1.2rem;
      font-weight: 600;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #status {
      font-size: 0.85rem;
      color: #94a3b8;
      white-space: nowrap;
    }
    #viewport {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <div id="navbar">
    <input type="text" id="urlInput" placeholder="https://example.com" />
    <button id="goBtn" onclick="loadProxy()">Go</button>
    <span id="status">Ready</span>
  </div>

  <!-- Note: When setting iframe src directly to worker, we remove restrictive sandbox flags that break scripts -->
  <iframe id="viewport"></iframe>

  <script>
    // REPLACE THIS WITH YOUR CLOUDFLARE WORKER URL:
    const PROXY_WORKER_URL = "https://my-cors-proxy.<your-subdomain>.workers.dev";

    document.getElementById("urlInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") loadProxy();
    });

    function loadProxy() {
      let rawUrl = document.getElementById("urlInput").value.trim();
      const status = document.getElementById("status");
      const iframe = document.getElementById("viewport");

      if (!rawUrl) return;

      if (!/^https?:\/\//i.test(rawUrl)) {
        rawUrl = "https://" + rawUrl;
        document.getElementById("urlInput").value = rawUrl;
      }

      try {
        new URL(rawUrl);
      } catch (err) {
        status.textContent = "Invalid URL";
        return;
      }

      status.textContent = "Loading...";
      iframe.onload = () => { status.textContent = "Loaded"; };
      iframe.onerror = () => { status.textContent = "Error loading"; };

      // Direct iframe navigation to the worker proxy
      iframe.src = `${PROXY_WORKER_URL}/?url=${encodeURIComponent(rawUrl)}`;
    }
  </script>
</body>
</html>
