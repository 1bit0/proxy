
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>e</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #64748b; cursor: not-allowed; }
    #status {
      font-size: 0.85rem;
      color: #94a3b8;
      white-space: nowrap;
    }
    #viewport {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <div id="navbar">
    <input type="text" id="urlInput" placeholder="Enter URL (e.g. en.wikipedia.org or example.com)" />
    <button id="goBtn" onclick="loadProxy()">Go</button>
    <span id="status">Ready</span>
  </div>

  <iframe id="viewport" sandbox="allow-scripts allow-forms allow-same-origin allow-popups"></iframe>

  <script>
    document.getElementById("urlInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") loadProxy();
    });

    // List of public CORS proxies to try in order
    const PROXIES = [
      (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
      (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
    ];

    async function fetchWithFallbacks(targetUrl, updateStatus) {
      let lastError = null;

      for (let i = 0; i < PROXIES.length; i++) {
        const proxyUrl = PROXIES[i](targetUrl);
        updateStatus(`Trying proxy ${i + 1}/${PROXIES.length}...`);

        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 9000); // 9s timeout per proxy

          const res = await fetch(proxyUrl, { signal: controller.signal });
          clearTimeout(timeoutId);

          if (res.ok) {
            const text = await res.text();
            if (text && text.trim().length > 0) return text;
          }
          lastError = new Error(`Proxy ${i + 1} responded with status ${res.status}`);
        } catch (err) {
          lastError = err;
        }
      }

      throw lastError || new Error("All proxy attempts failed.");
    }

    async function loadProxy() {
      let rawUrl = document.getElementById("urlInput").value.trim();
      const status = document.getElementById("status");
      const iframe = document.getElementById("viewport");
      const btn = document.getElementById("goBtn");

      if (!rawUrl) return;

      if (!/^https?:\/\//i.test(rawUrl)) {
        rawUrl = "https://" + rawUrl;
        document.getElementById("urlInput").value = rawUrl;
      }

      let target;
      try {
        target = new URL(rawUrl);
      } catch (err) {
        status.textContent = "Invalid URL";
        return;
      }

      btn.disabled = true;

      try {
        let html = await fetchWithFallbacks(target.href, (msg) => {
          status.textContent = msg;
        });

        // 1. Strip meta CSP headers that block frames
        html = html.replace(/<meta[^>]*http-equiv=["']?Content-Security-Policy["']?[^>]*>/gi, "");

        // 2. Inject <base> tag to point relative URLs back to the origin site
        const baseHref = target.origin + target.pathname;
        const baseTag = `<base href="${baseHref}">`;
        if (/<head[^>]*>/i.test(html)) {
          html = html.replace(/(<head[^>]*>)/i, `$1\n${baseTag}`);
        } else {
          html = `${baseTag}\n${html}`;
        }

        // 3. Write directly to iframe document
        const doc = iframe.contentWindow.document;
        doc.open();
        doc.write(html);
        doc.close();

        status.textContent = "Loaded";
      } catch (err) {
        status.textContent = "Failed to load";
        iframe.srcdoc = `
          <div style="font-family:sans-serif; padding:2rem; color:#dc2626;">
            <h3>Failed to load page</h3>
            <p>${err.message}</p>
            <p style="color:#64748b; font-size:0.9rem;">Sites with strict anti-bot protections (like Cloudflare Turnstile or CAPTCHAs) block shared public proxies.</p>
          </div>
        `;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
