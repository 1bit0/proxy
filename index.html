<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>In-Page Web Proxy Viewer</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    #navbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      background: #1e293b;
      border-bottom: 1px solid #334155;
    }
    #urlInput {
      flex: 1;
      padding: 0.5rem 0.8rem;
      font-size: 0.95rem;
      background: #0f172a;
      border: 1px solid #475569;
      color: #f8fafc;
      border-radius: 4px;
      outline: none;
    }
    #urlInput:focus {
      border-color: #38bdf8;
    }
    button {
      padding: 0.5rem 1.2rem;
      font-weight: 600;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #64748b; cursor: not-allowed; }
    #status {
      font-size: 0.85rem;
      color: #94a3b8;
      white-space: nowrap;
    }
    #viewport {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <div id="navbar">
    <input type="text" id="urlInput" placeholder="Enter URL (e.g. https://example.com or wikipedia.org)" />
    <button id="goBtn" onclick="loadProxy()">Go</button>
    <span id="status">Ready</span>
  </div>

  <iframe id="viewport" sandbox="allow-scripts allow-forms allow-same-origin allow-popups"></iframe>

  <script>
    document.getElementById("urlInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") loadProxy();
    });

    async function loadProxy() {
      let rawUrl = document.getElementById("urlInput").value.trim();
      const status = document.getElementById("status");
      const iframe = document.getElementById("viewport");
      const btn = document.getElementById("goBtn");

      if (!rawUrl) return;

      // Ensure protocol is present
      if (!/^https?:\/\//i.test(rawUrl)) {
        rawUrl = "https://" + rawUrl;
        document.getElementById("urlInput").value = rawUrl;
      }

      let target;
      try {
        target = new URL(rawUrl);
      } catch (err) {
        status.textContent = "Invalid URL";
        return;
      }

      btn.disabled = true;
      status.textContent = "Fetching via proxy...";

      try {
        // Fetch raw HTML through CORS proxy
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(target.href)}`;
        const res = await fetch(proxyUrl);

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        let html = await res.text();

        // 1. Strip meta tags that try to block iframes via CSP
        html = html.replace(/<meta[^>]*http-equiv=["']?Content-Security-Policy["']?[^>]*>/gi, "");

        // 2. Inject <base> tag so styles, scripts, images, and links resolve to the target host
        const baseTag = `<base href="${target.origin}${target.pathname}">`;
        if (/<head[^>]*>/i.test(html)) {
          html = html.replace(/(<head[^>]*>)/i, `$1\n${baseTag}`);
        } else {
          html = `${baseTag}\n${html}`;
        }

        // 3. Write directly to iframe document
        const doc = iframe.contentWindow.document;
        doc.open();
        doc.write(html);
        doc.close();

        status.textContent = "Loaded";
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
        iframe.srcdoc = `<p style="font-family:sans-serif; padding:1rem; color:red;">Failed to load: ${err.message}</p>`;
      } finally {
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>
